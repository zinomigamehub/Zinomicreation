<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zinomi Software Hub</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/software.css">
</head><body>
<header><div class="brand"><svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3cff"/><stop offset="1" stop-color="#3f86ff"/></linearGradient><linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#22a0f0"/></linearGradient><linearGradient id="sg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b78ff"/><stop offset="1" stop-color="#2f93f6"/></linearGradient><linearGradient id="sg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2186f6"/><stop offset="1" stop-color="#0fb3e6"/></linearGradient><linearGradient id="sgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g class="pt tl"><path d="M10 10L100.0 10A90.0 90.0 0 0 1 190 100.0A90.0 90.0 0 0 1 100.0 190A90.0 90.0 0 0 1 10 100.0Z" fill="url(#sg1)"/><path d="M10 10L100.0 10A90.0 90.0 0 0 1 190 100.0A90.0 90.0 0 0 1 100.0 190A90.0 90.0 0 0 1 10 100.0Z" fill="url(#sgl)"/></g><g class="pt tr"><path d="M390 10L390 100.0A90.0 90.0 0 0 1 300.0 190A90.0 90.0 0 0 1 210 100.0A90.0 90.0 0 0 1 300.0 10Z" fill="url(#sg2)"/><path d="M390 10L390 100.0A90.0 90.0 0 0 1 300.0 190A90.0 90.0 0 0 1 210 100.0A90.0 90.0 0 0 1 300.0 10Z" fill="url(#sgl)"/></g><g class="pt bl"><path d="M10 390L10 300.0A90.0 90.0 0 0 1 100.0 210A90.0 90.0 0 0 1 190 300.0A90.0 90.0 0 0 1 100.0 390Z" fill="url(#sg3)"/><path d="M10 390L10 300.0A90.0 90.0 0 0 1 100.0 210A90.0 90.0 0 0 1 190 300.0A90.0 90.0 0 0 1 100.0 390Z" fill="url(#sgl)"/></g><g class="pt br"><path d="M390 390L300.0 390A90.0 90.0 0 0 1 210 300.0A90.0 90.0 0 0 1 300.0 210A90.0 90.0 0 0 1 390 300.0Z" fill="url(#sg4)"/><path d="M390 390L300.0 390A90.0 90.0 0 0 1 210 300.0A90.0 90.0 0 0 1 300.0 210A90.0 90.0 0 0 1 390 300.0Z" fill="url(#sgl)"/></g></svg><h1>Zinomi <span>Software Hub</span></h1></div>
<div class="search"><input id="search" placeholder="Search software…  ( / )" autocomplete="off"></div><div class="sp"></div>
<button class="btn pri adm" id="addB">＋ Add</button><button class="btn adm" id="qB">⚡ Quick add</button><button class="btn adm" id="bkB">💾 Backup</button><button class="btn" id="cuB">👁 Customer mode</button>
<button class="btn cartb" id="cartB">🛒 Cart<b id="cc">0</b></button></header>
<main><section class="stats"><div class="stat"><b id="s1">0</b><span>Total software</span></div><div class="stat"><b id="s2">0 GB</b><span>Total size</span></div><div class="stat"><b id="s3">0</b><span>Total value</span></div><div class="stat"><b id="s4">0</b><span>In cart</span></div></section>
<div class="bar" id="chips"></div>
<div class="bar"><span class="mt">Sort</span><select id="sort"><option value="name">Name A–Z</option><option value="price">Price low → high</option><option value="size">Size big → small</option><option value="new">Newest</option></select><span class="mt" id="cnt"></span></div>
<div class="grid" id="grid"></div></main>
<div class="mod" id="mod"></div>
<aside class="drawer" id="drw"><h3>🛒 Your order</h3><div class="dl" id="dl"></div><div class="df"><input id="cn" placeholder="Customer name (optional)"><div class="tot"><span id="ct1">0 items · 0 GB</span><span id="ct2">Rs. 0</span></div><button class="btn pri" id="wa">Send on WhatsApp</button><button class="btn" id="rs">Record sale only</button><button class="btn" id="cl">Clear cart</button><button class="btn" id="cx">Close</button></div></aside>
<div id="toast"></div>
<script src="js/software.js"></script>
</body></html>
